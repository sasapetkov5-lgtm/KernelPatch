name: Build Syscallhook KPM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build
        run: |
          cd kpms/demo-syscallhook
          make NDK_PATH=$ANDROID_NDK_HOME

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: syscallhook-kpm
          path: kpms/demo-syscallhook/*.kpm

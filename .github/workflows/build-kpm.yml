name: Build KPM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - run: cd kpms/demo-syscallhook && make NDK_PATH=$ANDROID_NDK_HOME
      - uses: actions/upload-artifact@v4
        with:
          name: kpm
          path: kpms/demo-syscallhook/*.kpm
